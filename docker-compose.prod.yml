# Production stack: Caddy (the two apps + /api proxy), the API, MongoDB with authentication, and backups.
#
#   cp .env.example .env.production   # fill in every value marked "required in production"
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only the web container publishes ports, and they default to 9080/9443 — chosen because the
# shared VM already uses 80, 3000-3005, 4000-4030, 5000-5173, 5432, 5434, 6379, 7100-7110 and
# 8001-8501. MongoDB and the API are reachable only on the internal network.
name: noble-prod

services:
  mongo-keyfile:
    image: mongo:8
    # Generates the replica-set keyfile once; MongoDB requires it when auth and a replica set are combined.
    entrypoint:
      - bash
      - -c
      - "test -f /keys/keyfile || (openssl rand -base64 756 > /keys/keyfile && chmod 400 /keys/keyfile && chown 999:999 /keys/keyfile)"
    volumes:
      - mongo_keys:/keys
    restart: "no"

  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keys/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_APP_DB: noble
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_keys:/keys:ro
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: "4100"
      LOG_PRETTY: "false"
      UPLOADS_DIR: /data/uploads
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/noble?replicaSet=rs0&authSource=noble
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the bundle at build time. The Mapbox token is a public pk.… token.
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: mongo:8
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      MONGO_BACKUP_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/noble?authSource=admin&directConnection=true
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - uploads_data:/data/uploads:ro
      - backups:/backups
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_keys:
  uploads_data:
  caddy_data:
  caddy_config:
  backups:
